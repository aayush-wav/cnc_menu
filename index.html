<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Cassette &amp; Chiya — Food Playlist Menu</title>
		<meta
			name="description"
			content="Cassette and Chiya. Mom's Food, Dad's Playlist. The food playlist menu." />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Special+Elite&family=Vollkorn:ital,wght@0,400;0,500;0,600;1,400&family=Courier+Prime:wght@400;700&family=Rye&display=swap"
			rel="stylesheet" />
		<style>
			:root {
				--paper: #cfc092;
				--ink: #180c02;
				--ink-mid: #352414;
				--ink-soft: #5a462e;
				--rust: #6e2818;
				--gold: #886418;
				--gold-b: #a88228;
				--tape: #0c0602;
				--line: rgba(24, 12, 2, 0.32);
				--max: 740px;
			}

			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			html {
				scroll-behavior: smooth;
				background: #1a1008;
			}

			body {
				background-color: #1a1008;
				color: var(--ink);
				font-family: "Vollkorn", Georgia, serif;
				-webkit-font-smoothing: antialiased;
				min-height: 100vh;
			}

			a {
				color: inherit;
			}

			/* ===== FRAME ===== */
			.menu-frame {
				position: relative;
				z-index: 1;
				max-width: var(--max);
				margin: 0 auto;
				background: var(--paper);
				background-image: url("bg.png");
				background-size: calc(100% + 60px) calc(100% + 60px);
				background-position: center center;
				background-repeat: no-repeat;
				background-blend-mode: darken;
				min-height: 100vh;
			}

			@media (max-width: 560px) {
				.menu-frame {
					margin: 0;
				}
			}

			/* ===== NAV ===== */
			.navbar {
				position: sticky;
				top: 0;
				z-index: 50;
				background: var(--tape);
				border-bottom: 3px solid var(--rust);
				overflow-x: auto;
				white-space: nowrap;
				-webkit-overflow-scrolling: touch;
				scrollbar-width: none;
			}

			.navbar::-webkit-scrollbar {
				display: none;
			}

			.navbar-inner {
				display: flex;
				gap: 0;
				padding: 0 4px;
			}

			.navbar button {
				flex: 0 0 auto;
				background: none;
				border: none;
				cursor: pointer;
				color: #a89070;
				font-family: "Special Elite", monospace;
				font-size: 10px;
				letter-spacing: 0.1em;
				text-transform: uppercase;
				padding: 10px 9px;
				border-bottom: 2px solid transparent;
				transition:
					color 0.2s,
					border-color 0.2s;
			}

			.navbar button:hover,
			.navbar button.active {
				color: #d8b850;
				border-bottom-color: var(--rust);
			}

			/* ===== HERO ===== */
			.hero {
				text-align: center;
				padding: 28px 20px 22px;
				border-bottom: 3px solid var(--ink);
				position: relative;
			}

			/* SVG Logo stencil */
			.logo-stencil {
				display: block;
				margin: 0 auto 12px;
				width: 140px;
				height: auto;
				object-fit: contain;
				mix-blend-mode: multiply;
				opacity: 0.92;
			}

			.hero .top-text {
				font-family: "Special Elite", monospace;
				letter-spacing: 0.35em;
				text-transform: uppercase;
				color: var(--ink);
				font-size: 11px;
				margin-bottom: 2px;
			}

			.hero h1 {
				font-family: "Bebas Neue", sans-serif;
				font-size: clamp(60px, 16vw, 100px);
				line-height: 0.85;
				letter-spacing: 0.03em;
				color: var(--ink);
				text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.06);
				margin: 0;
			}

			.hero .playlist-text {
				font-family: "Rye", serif;
				font-size: clamp(32px, 9vw, 54px);
				color: var(--ink);
				letter-spacing: 0.06em;
				line-height: 1;
				margin-bottom: 8px;
				text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.05);
			}

			.hero .tagline-box {
				display: inline-flex;
				align-items: center;
				gap: 10px;
				border: 2.5px solid var(--ink);
				padding: 4px 18px;
				background: rgba(0, 0, 0, 0.04);
			}

			.hero .tagline-box span {
				font-family: "Special Elite", monospace;
				font-size: 11px;
				letter-spacing: 0.1em;
				text-transform: uppercase;
				color: var(--ink);
			}

			.inline-star {
				display: inline-block;
				width: 12px;
				height: 12px;
				vertical-align: middle;
				fill: var(--ink);
			}

			/* Small vinyl circle */
			.vinyl-icon {
				display: block;
				margin: 14px auto 0;
				width: 30px;
				height: 30px;
				border: 2.5px solid var(--ink);
				border-radius: 50%;
				background: radial-gradient(
					circle,
					var(--ink) 3.5px,
					transparent 3.5px,
					transparent 5.5px,
					var(--ink-mid) 5.5px,
					var(--ink-mid) 6.5px,
					transparent 6.5px
				);
			}

			/* ===== DRINKS SECTION HEADER (mini-hero, echoes main hero) ===== */
			.drinks-head {
				text-align: center;
				padding: 30px 20px 24px;
				border-top: 3px solid var(--ink);
				border-bottom: 3px solid var(--ink);
				margin: 22px 28px 0;
			}

			@media (max-width: 560px) {
				.drinks-head {
					margin: 22px 14px 0;
					padding: 24px 16px 20px;
				}
			}

			.drinks-head .top-text {
				font-family: "Special Elite", monospace;
				letter-spacing: 0.3em;
				text-transform: uppercase;
				color: var(--ink);
				font-size: 10px;
				margin-bottom: 4px;
			}

			.drinks-head h2 {
				font-family: "Bebas Neue", sans-serif;
				font-size: clamp(38px, 10vw, 64px);
				line-height: 0.88;
				letter-spacing: 0.02em;
				color: var(--ink);
				margin: 0;
				text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.06);
			}

			.drinks-head .sub-script {
				font-family: "Rye", serif;
				font-size: clamp(18px, 5.5vw, 30px);
				color: var(--ink);
				letter-spacing: 0.05em;
				margin-top: 2px;
				text-shadow: 1.5px 1.5px 0 rgba(0, 0, 0, 0.05);
			}

			.drinks-head .tagline-box {
				display: inline-flex;
				align-items: center;
				gap: 8px;
				border: 2px solid var(--ink);
				padding: 3px 14px;
				margin-top: 12px;
				background: rgba(0, 0, 0, 0.04);
			}

			.drinks-head .tagline-box span {
				font-family: "Special Elite", monospace;
				font-size: 10px;
				letter-spacing: 0.08em;
				text-transform: uppercase;
				color: var(--ink);
			}

			.drinks-head .mini-vinyl {
				display: block;
				margin: 12px auto 0;
				width: 22px;
				height: 22px;
				border: 2px solid var(--ink);
				border-radius: 50%;
				background: radial-gradient(
					circle,
					var(--ink) 2.6px,
					transparent 2.6px,
					transparent 4.2px,
					var(--ink-mid) 4.2px,
					var(--ink-mid) 5px,
					transparent 5px
				);
			}

			/* ===== BAR DIVIDER ===== */
			.bar-div {
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 12px 16px;
				background: transparent;
				color: var(--ink);
				font-family: "Special Elite", monospace;
				font-size: 11.5px;
				letter-spacing: 0.35em;
				text-transform: uppercase;
				border-top: 2px solid var(--ink);
				border-bottom: 2px solid var(--ink);
				margin: 15px 20px;
			}

			@media (max-width: 560px) {
				.bar-div {
					margin: 15px 14px;
				}
			}

			/* ===== SECTIONS ===== */
			.page {
				padding: 22px 28px 6px;
			}

			@media (max-width: 560px) {
				.page {
					padding: 18px 14px 6px;
				}
			}

			.cat-head {
				display: flex;
				align-items: center;
				gap: 8px;
				padding-bottom: 4px;
				border-bottom: 3px solid var(--ink);
			}

			.cat-head h2 {
				font-family: "Rye", serif;
				font-size: clamp(20px, 5.5vw, 30px);
				letter-spacing: 0.03em;
				color: var(--ink);
				text-transform: uppercase;
			}

			.star-svg {
				width: 14px;
				height: 14px;
				fill: var(--ink);
				flex-shrink: 0;
			}

			.cat-sub {
				text-align: center;
				margin: 5px 0 3px;
			}

			.cat-sub-text {
				display: inline-flex;
				align-items: center;
				gap: 8px;
				font-family: "Special Elite", monospace;
				font-size: 10px;
				letter-spacing: 0.12em;
				text-transform: uppercase;
				color: var(--ink-soft);
			}

			.cat-sub-text::before,
			.cat-sub-text::after {
				content: "";
				width: 35px;
				height: 1px;
				background: var(--line);
			}

			.sec-note {
				font-size: 11px;
				color: var(--ink-soft);
				font-style: italic;
				margin: 2px 0 10px;
				text-align: center;
			}

			/* ===== ITEMS ===== */
			.items {
				list-style: none;
				padding: 0;
				margin: 6px 0 0;
			}

			.it {
				margin-bottom: 9px;
			}

			.it-row {
				display: flex;
				align-items: baseline;
				gap: 3px;
			}

			.it-name {
				font-family: "Special Elite", monospace;
				font-size: 14.5px;
				font-weight: 700;
				color: var(--ink);
				white-space: nowrap;
				flex-shrink: 0;
				letter-spacing: 0.045em;
			}

			.it-tags {
				display: inline-flex;
				gap: 2px;
				margin-left: 3px;
				vertical-align: 1px;
				flex-shrink: 0;
			}

			.it-tag {
				font-family: "Courier Prime", monospace;
				font-size: 7px;
				font-weight: 700;
				color: var(--rust);
				border: 1px solid var(--rust);
				border-radius: 50%;
				width: 12px;
				height: 12px;
				display: inline-flex;
				align-items: center;
				justify-content: center;
			}

			.dots {
				flex: 1;
				border-bottom: 2px dotted var(--ink-mid);
				margin: 0 4px;
				min-width: 14px;
				align-self: baseline;
				margin-bottom: 3px;
				opacity: 0.4;
			}

			.pr {
				font-family: "Courier Prime", monospace;
				font-weight: 700;
				font-size: 13px;
				color: var(--ink);
				white-space: nowrap;
				flex-shrink: 0;
			}

			.it-desc {
				font-family: "Vollkorn", serif;
				font-style: italic;
				font-weight: 400;
				font-size: 10.5px;
				line-height: 1.4;
				color: var(--ink-soft);
				opacity: 0.85;
				letter-spacing: 0.01em;
				margin-top: 3px;
				max-width: 96%;
			}

			.subcat {
				font-family: "Special Elite", monospace;
				font-size: 10px;
				letter-spacing: 0.1em;
				text-transform: uppercase;
				color: var(--ink-mid);
				text-align: center;
				margin: 14px 0 8px;
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 8px;
			}

			.subcat::before,
			.subcat::after {
				content: "\2014";
				color: var(--ink-soft);
				opacity: 0.4;
			}

			.sec-line {
				border: none;
				height: 2px;
				background: repeating-linear-gradient(
					90deg,
					var(--ink-mid) 0px,
					var(--ink-mid) 4px,
					transparent 4px,
					transparent 8px
				);
				margin: 8px 28px 0;
				opacity: 0.25;
			}

			@media (max-width: 560px) {
				.sec-line {
					margin: 8px 14px 0;
				}
			}

			/* ===== ALLERGENS ===== */
			.legend-grid {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 5px 16px;
				margin-top: 8px;
			}

			@media (max-width: 560px) {
				.legend-grid {
					grid-template-columns: 1fr;
				}
			}

			.legend-row {
				display: flex;
				align-items: center;
				gap: 7px;
				font-size: 11px;
				color: var(--ink-soft);
			}

			.allergen-box {
				margin-top: 16px;
				padding: 12px 14px;
				border: 2px solid var(--ink);
				border-left: 5px solid var(--rust);
				font-size: 11.5px;
				line-height: 1.5;
				color: var(--ink);
				background: rgba(0, 0, 0, 0.02);
			}

			.allergen-box strong {
				font-family: "Special Elite", monospace;
				font-size: 10px;
				letter-spacing: 0.1em;
				color: var(--rust);
				text-transform: uppercase;
				display: block;
				margin-bottom: 4px;
			}

			/* ===== REVIEW CTA ===== */
			.review-cta {
				text-align: center;
				padding: 28px 20px 12px;
			}

			.review-btn {
				display: inline-flex;
				align-items: center;
				gap: 12px;
				background: var(--tape);
				color: var(--gold-b);
				font-family: "Rye", serif;
				font-size: clamp(16px, 4.5vw, 24px);
				letter-spacing: 0.06em;
				text-decoration: none;
				padding: 14px 36px;
				border: 3px solid var(--gold);
				cursor: pointer;
				transition: all 0.3s ease;
				box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.2);
			}

			.review-btn:hover {
				background: var(--rust);
				border-color: var(--paper);
				color: var(--paper);
				transform: translate(-2px, -2px);
				box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.25);
			}

			/* ===== FOOTER ===== */
			footer {
				padding: 18px 20px 24px;
				text-align: center;
				border-top: 3px solid var(--ink);
				background: rgba(0, 0, 0, 0.02);
			}

			footer .f-name {
				font-family: "Special Elite", monospace;
				font-size: 10px;
				letter-spacing: 0.2em;
				color: var(--ink-soft);
				text-transform: uppercase;
				margin-bottom: 4px;
			}

			footer .f-slogan {
				font-family: "Rye", serif;
				font-size: 18px;
				letter-spacing: 0.06em;
				color: var(--ink);
			}

			/* ===== PRINT ===== */
			@media print {
				.navbar,
				.review-cta {
					display: none;
				}

				.menu-frame {
					margin: 0;
				}
			}

			/* ===== MOBILE ===== */
			@media (max-width: 420px) {
				.hero h1 {
					font-size: 50px;
				}

				.hero .playlist-text {
					font-size: 28px;
				}

				.logo-stencil {
					width: 110px;
					height: auto;
				}

				.it-name {
					font-size: 12.5px;
				}

				.it-desc {
					font-size: 9.5px;
				}

				.pr {
					font-size: 11.5px;
				}

				.cat-head h2 {
					font-size: 18px;
				}

				.review-btn {
					padding: 12px 24px;
					font-size: 15px;
				}
			}
		</style>
	</head>

			const root = document.getElementById("menuRoot"),

			function mkItem(it) {
				const tags = (it.tags || [])

						(c) =>
							`<span class="it-tag" title="${ALLERGENS[c] || c}">${c}</span>`,
					)
					.join("");
				return `<li class="it"><div class="it-row"><span class="it-name">${it.name}<span class="it-tags">${tags}</span></span><span class="dots"></span><span class="pr">${it.price}</span></div>${it.desc ? `<div class="it-desc">${it.desc}</div>` : ""}</li>`;
			}
			MENU.forEach((sec) => {

					root.appendChild(dh);
				}
				const btn = document.createElement("button");
				btn.textContent = sec.title;
				btn.onclick = () =>
					document
						.getElementById(sec.id)
						.scrollIntoView({ behavior: "smooth", block: "start" });
				navInner.appendChild(btn);

				pg.className = "page";
				pg.id = sec.id;
				pg.innerHTML = `<div class="cat-head"><svg class="star-svg"><use href="#ico-star"/></svg><h2>${sec.title}</h2><svg class="star-svg"><use href="#ico-star"/></svg></div><div class="cat-sub"><span class="cat-sub-text">${sec.sub}</span></div>${sec.note ? `<p class="sec-note">${sec.note}</p>` : ""}`;
				if (sec.subCategories) {
					sec.subCategories.forEach((sc) => {
						pg.innerHTML += `<div class="subcat">${sc.label}</div><ul class="items">${sc.items.map(mkItem).join("")}</ul>`;
					});
				} else {
					pg.innerHTML += `<ul class="items">${sec.items.map(mkItem).join("")}</ul>`;
				}
				root.appendChild(pg);
				const hr = document.createElement("hr");
				hr.className = "sec-line";
				root.appendChild(hr);
			});
			/* Allergens */
			const lp = document.createElement("section");
			lp.className = "page";
			lp.id = "allergens";
			lp.innerHTML = `<div class="cat-head"><svg class="star-svg"><use href="#ico-star"/></svg><h2>Liner Notes</h2><svg class="star-svg"><use href="#ico-star"/></svg></div><div class="cat-sub"><span class="cat-sub-text">Allergen Key</span></div><div class="legend-grid" id="lg"></div><div class="allergen-box"><strong>Allergen Notice</strong>Everything is made in a shared kitchen so cross contact with allergens can happen. Let our staff know about any food allergies before you order.</div>`;
			root.appendChild(lp);
			Object.entries(ALLERGENS).forEach(([c, l]) => {
				const r = document.createElement("div");
				r.className = "legend-row";
				r.innerHTML = `<span class="it-tag">${c}</span><span>${l}</span>`;
				document.getElementById("lg").appendChild(r);
			});
			/* Nav highlight */
			const navBtns = Array.from(navInner.children),
				secs = MENU.map((s) => document.getElementById(s.id));
			window.addEventListener(
				"scroll",
				() => {
					let idx = 0;
					secs.forEach((s, i) => {
						if (s.getBoundingClientRect().top - 90 <= 0) idx = i;
					});
					navBtns.forEach((b) => b.classList.remove("active"));
					if (navBtns[idx]) navBtns[idx].classList.add("active");
				},
				{ passive: true },
			);
		</script>
	</body>
</html>
